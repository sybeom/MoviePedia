spring:
  application:
    name: moviepedia
  # 데이터 소스 구성
  datasource:
    url: jdbc:mysql://localhost:3306/moviepedia?serverTimezone=Asia/Seoul
    username: root
    password: 23706668

  # JPA
  jpa:
    hibernate:
      ddl-auto: update # create : 재시작시 테이블 매번 생성 , update
    properties:
      hibernate:
        format_sql: true # 콘솔창의 sql을 보기 좋은 방식으로 변경 해줌

  # OAuth2 : NAVER registration
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: _SiioRAKa8mI0tYfGTrb
            client-secret: paobyJijdl
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  # 엘라스틱서치
  elasticsearch:
    uris: http://localhost:9200
# TMDB 경로 및 토큰 값
tmdb:
  api:
    base-url: https://api.themoviedb.org/3
    # 값은 RUN -> Edit Configuration -> Environment variables에 설정되어있음. Authorization 헤더에 설정된다
    token: ${TMDB_API_TOKEN}

logging.level:
  org.hibernate.SQL: debug # logger를 통해 하이버네이트 실행 SQL을 남긴다.
  co.elastic.clients.transport.rest5_client: trace
